name: monk_mode
description: "Monk Mode: Dopamine Detox — focus timer, streaks & Focus Together rooms."
publish_to: none
version: 1.4.16+32

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Key-value local storage — persists streak, sessions, and focus time.
  shared_preferences: ^2.3.3

  # Animated circular ring used for the timer and dopamine score display.
  percent_indicator: ^4.2.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  firebase_core: ^4.6.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.2.0
  rxdart: ^0.28.0
  flutter_localizations:
    sdk: flutter
  intl: any

  # Keep display awake during an active focus timer (matches common productivity apps).
  wakelock_plus: ^1.2.8
  google_sign_in: ^6.2.2

  # Play Store native in-app update check (Android only).
  in_app_update: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Enforces Flutter's recommended lint rules.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Android adaptive icon — solid dark background matching the icon itself.
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
